name: TD-2026-001 integrity checks

on:
  push:
    branches: [main, research-integration-v2.2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate required preservation files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f llms.txt
          test -f CITATION.cff
          test -f TD-2026-001-v1.1.md
          test -f TD-2026-001-v2.0.md
          test -f TD-2026-001-v2.1.md
          test -f TD-2026-001-v2.3.md
          test -f TD-2026-001-v1.1.txt
          test -f TD-2026-001-v2.1.txt
          test -f continuity-kit/START-HERE.txt
          test -f continuity-kit/VERIFY.txt
          test -f continuity-kit/DECODER.txt
          test -f continuity-kit/CONTEXT.txt
          test -f continuity-kit/HISTORY.txt
          test -f continuity-kit/TD-2026-001-v2.3.txt
          test -f docs/MULTI-AI.md
      - name: Check JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool TD-2026-001-manifest.json >/dev/null
          python -m json.tool TD-2026-001-manifest-v2.0.json >/dev/null
          python -m json.tool continuity-kit/MANIFEST.json >/dev/null
      - name: Verify continuity-kit hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum continuity-kit/TD-2026-001-v1.1.txt | cut -d' ' -f1)" = "df454207428e99b4e269800e52e355bb21d681c42471d21d764189e6a1167b49"
          test "$(sha256sum continuity-kit/TD-2026-001-v2.3.txt | cut -d' ' -f1)" = "cf90b4f1fbf610557004fc2bb82a940e2576ac4c1f01fcbddde6a90a8db62bab"
      - name: Detect obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' . --exclude-dir=.git; then
            echo "Potential credential material detected."
            exit 1
          fi
